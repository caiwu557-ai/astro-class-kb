<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>知识库阅读桥</title><style>body{font:14px system-ui;width:300px;padding:16px;color:#17212b}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:8px}button{padding:9px 12px}p{line-height:1.5}#status{white-space:pre-wrap}</style><h2>连接自己的 Agent</h2><p>先让 Agent 启动本机 MCP 桥，并取得配对码。当前知识库标签页将作为 Agent 的专用阅读页，请勿在此编辑。</p><label for="port">本机端口<input id="port" type="number" min="1024" max="65535" value="38473"></label><label for="code">本次配对码<input id="code" type="password" autocomplete="off"></label><button id="connect">共享当前知识库页并连接</button><p id="status" role="status"></p><script src="popup.js"></script></html>
